
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Relatório Playwright - Testes E2E</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    h1 { color: #4CAF50; }
    .test { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }

<body>
  <h1>Relatório de Testes E2E - Playwright</h1>

    <ul>
      <li>Acessou o sistema</li>
      <li>Realizou login com admin@example.com</li>

    </ul>
  </div>

</html>
